---
deployment:
  tasks:
    - export DEPLOYPATH=/home1/mzadwkmy/public_html/
    # Deploy the BUILT Astro output. We copy the CONTENTS of dist/ (note the
    # trailing "/.") into public_html. This auto-includes every built page and
    # asset, so new pages in later phases need no change here.
    # Server-only files (.htaccess, robots.txt, sitemap.xml) are NOT in dist/,
    # so they are never touched. cp does not delete: files removed from dist/
    # stay on the server until deleted by hand in cPanel File Manager.
    - /bin/cp -R dist/. $DEPLOYPATH
    # Server script for Amazon product images (server/refresh-images.php, run by
    # cron). It goes OUTSIDE public_html so it can never be opened from the web.
    # config.php (with the API secret) exists only on the server, not in git,
    # so this copy never overwrites it.
    - export APIPATH=/home1/mzadwkmy/mysewingpicks-api/
    - /bin/mkdir -p $APIPATH
    - /bin/chmod 700 $APIPATH
    - /bin/cp server/refresh-images.php server/catalog-tool.php server/config.example.php $APIPATH
    # Legal notice (de/es/fr): the owner's name/address/e-mail live ONLY on the server in
    # $APIPATH/legal.php (never in git). dist/ ships the pages with placeholders, so every deploy
    # fills them in again; the script self-tests first and leaves the pages alone if anything is off.
    - /bin/cp server/legal.example.php $APIPATH
    - /usr/local/bin/php server/fill-legal.php $DEPLOYPATH $APIPATH/legal.php
